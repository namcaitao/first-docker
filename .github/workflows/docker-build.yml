name: Docker Build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Bước mới: đăng nhập vào Docker Hub bằng 2 secret đã tạo
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build image, đặt tên theo dạng "tenban/ten-image:latest"
      # THAY "namcaitao" bằng đúng username Docker Hub của bạn nếu khác
      - name: Build Docker image
        run: docker build -t namcaitao/hello-app:latest .

      # Chạy thử để chắc chắn image hoạt động trước khi đẩy lên
      - name: Run container (test)
        run: docker run namcaitao/hello-app:latest

      # Bước mới: đẩy image lên Docker Hub
      - name: Push to Docker Hub
        run: docker push namcaitao/hello-app:latest
